name: build
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed base-devel git sdl2 sdl2_image sdl2_mixer sdl2_ttf unzip fontconfig
      - uses: actions/checkout@v4
      - run: make
      - run: ./aimless 2>&1 | head -1 || true
